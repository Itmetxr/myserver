<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Monitoring - Add Log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="brand-copy">
            <h1>Drone Monitoring Dashboard</h1>
            <p>Monitor drone configuration and temperature logs</p>
        </div>
        <nav class="navbar" aria-label="Main navigation">
            <a href="/config" class="tab-btn">View Config</a>
            <a href="/form" class="tab-btn active">Log Form</a>
            <a href="/logs" class="tab-btn">View Logs</a>
        </nav>
    </header>

    <div class="intro-overlay" id="introOverlay" aria-hidden="true">
        <div class="intro-lockup">
            <p class="intro-title">Drone Monitoring Dashboard</p>
            <span class="intro-underline"></span>
        </div>
    </div>

    <section id="temperaturePage" class="page active">
        <h2>Add Temperature Log</h2>

        <div class="form-card">
            <p><strong>Drone Name:</strong> <span id="formDroneName">-</span></p>
            <p><strong>Country:</strong> <span id="formDroneCountry">-</span></p>

            <form id="temperatureForm">
                <label for="temperature">Temperature (°C)</label>

                <div class="temperature-entry">
                    <input
                        type="number"
                        id="temperature"
                        name="temperature"
                        step="0.1"
                        placeholder="Enter temperature"
                        required
                    >
                    <button type="submit" id="submitTemperatureBtn">Submit Temperature</button>
                </div>

                <div id="submitProgress" class="submit-progress" role="status" aria-live="polite" hidden>
                    <span class="submit-progress-label">Sending temperature data...</span>
                    <span class="submit-progress-track" role="progressbar" aria-label="Sending temperature data" aria-valuetext="In progress">
                        <span class="submit-progress-indicator"></span>
                    </span>
                </div>

                <p id="formMessage" role="status" aria-live="polite"></p>
            </form>

            
        </div>
    </section>
</body>
</html>
